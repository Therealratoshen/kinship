name: Feature request
description: Something the project does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Read `ROADMAP.md` first.** It says, for each gap, whether a contributor may close it or
        it is the owner's call — and several refusals are enforced by the validator, so the right
        PR fails a gate rather than a review.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today. Not the feature you want — the problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: "And, if it changes what the fleet may do, which invariant it touches and what the refusal should be."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you send this
      options:
        - label: I have read `ROADMAP.md`, and the `DECISIONS.md` rows this request touches, and it does not ask for a hosted Kinship, a funnel from the open-source project, or a change to the self-hosted parity of the governance layer.
          required: true
        - label: I understand that several of the project's refusals are enforced by the validator, so the right PR fails a gate rather than a review.
          required: false
