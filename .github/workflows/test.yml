name: Governance Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: these gates only read the checkout, never write.
permissions:
  contents: read

# A new push to the same branch cancels the run still in flight — no stale gate pile-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Pinned, not ubuntu-latest: latest moves to Ubuntu 26 on 2026-10-19 and would change the
    # runner under a green commit. Reproducibility is the product; CI holds to it too.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Pack shape gate
        run: node scripts/validate-pack.mjs packs/kopdar-ops

      - name: Validator contract tests
        run: node --test scripts/validate-pack.test.mjs

      - name: Runtime semantics tests
        run: |
          cd runtime
          node --test test/*.test.ts

      - name: Tour smoke test (on-ramp self-check)
        run: |
          cd runtime
          node tour.ts
