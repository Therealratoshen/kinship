name: Governance Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: these gates only read the checkout, never write.
permissions:
  contents: read

# A new push to the same branch cancels the run still in flight — no stale gate pile-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Pinned, not ubuntu-latest: latest moves to Ubuntu 26 on 2026-10-19 and would change the
    # runner under a green commit. Reproducibility is the product; CI holds to it too.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      # package.json claims `>=23`, so every supported major is gated — a claim CI does not test is a claim
      # that rots. 'lts'/'current' are deliberately absent: they would flip the gate on a schedule nobody set.
      matrix:
        node: ['23', '24']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # One step, because the gate list is a claim the repo makes in six places. `scripts/gates.mjs`
      # holds it, and gate 2 of that list runs `scripts/gates.test.mjs`, which fails if README,
      # AGENTS, CONTRIBUTING, the PR template, or the tour's own --json map stops printing the same
      # four commands. CI re-typing the list would be the copy nobody checks.
      - name: Governance gates (shape, contracts, semantics, tour)
        run: node scripts/gates.mjs

  # The reference host's own tests. This is NOT a fifth gate: the gate list stays four, and a gate
  # list that grows is a doc that drifts (D24). It is a package's own test suite, like any package's
  # — the host is a sibling package with its own manifest (spec/HOST-CONTRACT.md), and its one
  # dependency is a local path, so `npm install` here creates a symlink and fetches nothing.
  host:
    name: Reference host
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['23', '24']

    defaults:
      run:
        working-directory: adapters/reference

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install (a local symlink, no registry)
        run: npm install --no-audit --no-fund

      - name: Reference host tests
        run: npm test

  # The type contract. This is NOT a fifth gate either: the gate list stays four (D24). It is the
  # compiler checking the thing the repo's types are FOR — the vocabulary (`Revision`, `Lane`,
  # `Verdict`, `CommunityCoverage`) is the spec, and a spec that is not checked is prose.
  #
  # It runs here and NOT in `runtime/package.json` on purpose. D53 recorded that the typecheck could
  # not be a gate because a gate needs the dependency, and the dependency cannot live in the runtime
  # package (D21: a fork installs nothing). That reasoning was right about the PACKAGE and wrong about
  # the consequence: a CI job can install the compiler itself, and the runtime stays dependency-free
  # for whoever forks it. The zero-install property is about what a FORK downloads, not about what CI
  # downloads.
  #
  # And this was not theoretical. D58 changed the shape of the copy, and the TOUR broke — because
  # `runtime/tsconfig.json` included only `src/**` and `test/**`, so the tour had never been
  # typechecked at all, and the first thing the typecheck caught once the tour was inside it was a
  # real latent defect. A type contract nobody runs is not a contract.
  types:
    name: Type contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['23', '24']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The compiler and the node types are installed HERE, in the job, and nowhere in the repo's
      # packages. Nothing a fork installs changes.
      - name: Install the compiler (CI only — the runtime stays dependency-free)
        run: npm install --no-save --no-package-lock --no-audit --no-fund typescript@5 @types/node@22

      - name: Typecheck
        run: npx tsc -p runtime/tsconfig.json --noEmit
