# .kinship.yaml — the machine-readable half of the pack.
#
# Behaviour lives in PACK.md and agents/*/AGENT.md. This file carries only what a runtime must
# enforce and a human must not have to parse: schema identity, per-agent permissions, budgets,
# and the install gate. Shape donated from Paperclip's `.paperclip.yaml` (study §5); the
# per-action-class keying and the absent-not-denied posture are Kinship's (spec §1.1).
#
# Nothing in the pack file decides behaviour on its own: `scripts/validate-pack.mjs` checks the shape
# and `runtime/src/pack.ts` boots through that same gate, so an edit here is a change to what the
# runtime enforces (DECISIONS.md D21). Naming the schema before the engine was the point — the
# publishable artifact came first, and the engine was built behind it.

schema: kinship/v1
key: kinshipai/bundled/event-ops/kopdar
version: 0.1.0
organisation: kinshipai           # the tier above this pack: orgs/kinshipai.yaml holds the floors this
                                  # pack may not go below, and the one human seat it may not widen (D35).
                                  # Drop this line and the pack is its own top tier — legal, and said so
                                  # in a validator notice rather than silently.
bundled: true                 # invariants here are held by us; a community pack may not claim this
locale: [id, en]              # Indonesian-first, English paired. Both, always, in member copy.

# --- Permissions, per agent, per action class (spec Part 5) --------------------
# `autonomy` values: draft | opt-in-auto | never
# A class absent from this map behaves as `never` — default is deny, and an
# unset class is not a loophole.
agents:
  event-ops:
    autonomy_by_class:
      observe.read: opt-in-auto        # zero outbound; scoped to named channels
      draft.promote: draft
      draft.reminder: draft
      report.assemble: draft
      report.aggregate-only: opt-in-auto      # spec §2.9.3 — assembly-time floor; the agent never holds the name
      member.suppression-check: opt-in-auto   # spec §2.9.2 — mandatory and unbypassable before any commit class
      budget.spend: opt-in-auto        # under the ceiling, warn-then-hard-stop
      escalate.to-human: opt-in-auto
    tools:                              # write paths, all gated by the class above
      - gcal | write
      - luma | read                     # write exists but needs Luma Plus; see PACK.md note 4
      - gmail | draft
      - sheets_or_notion | read
    grants: []                          # always-grants live here, enumerable + revocable (spec §1.8)
  engagement:
    autonomy_by_class:
      observe.read: opt-in-auto
      draft.promote: draft
      rsvp.chase: draft
      nudge.no_show: draft
      answer.question: draft            # fast reply lane; stays `draft` until shadow mode licenses it
      commit.individual-message: draft
      commit.channel-post: draft        # Allow-once only in v0 — the class phase 1 exists to earn
      member.notify-optout: opt-in-auto # the member's own control; nothing may promote past it (§2.9.2)
      member.notify-human: opt-in-auto  # "who is responsible for this?" -> the on_behalf_of line (FR-5.1)
      member.digest-source-check: opt-in-auto  # §2.9 / FR-5.7 — only publish-consented channels are cited
      promote.cross-community: draft     # §2.11 / FR-6 — partner content; unreachable unless needs.partner_policy answers it
    tools:
      - telegram | send
      - discord | send
      - whatsapp | read
      - whatsapp | draft                # NOT send. Group send is absent from the pack entirely (D11).
      - gmail | draft
  moderator:
    autonomy_by_class:
      observe.read: opt-in-auto
      moderate.flag: opt-in-auto        # flag-only in bundled packs; the human acts
      member.notify-flagged: draft      # spec §2.9.4 — the subject of a flag is told, after the fact, with reason
    outputs: human_queue                # flagged(reason, confidence) -> organiser decides; appeals return here
    tools:
      - whatsapp | read
      - discord | read
    # No delete. No ban. No mute. Not denied — absent, so a reviewer can grep it.
    # Also absent, per spec Part 5: score.member, member.opt-out-override, report.name-a-member.
    # A product that CAN rank its members will be asked to, by a sponsor, quarterly.

# --- Invariants a fork may not configure away ----------------------------------
# The validator fails on deletion of any key below, and on a value that flips it.
guardrails:
  identity_disclosure: required          # spec §2.8 — outside the escalation path
  member_input_is_data_not_instruction: true   # spec §2.1 / §2.7
  trust_preset_resolution: fail_closed_narrower_wins   # spec §1.7
  low_trust_cannot_auto_promote: true
  private_objects_return: 404            # not 403
  break_glass_must_be_audible: true      # spec §1.9.2
  redaction_layers: 3
  masked_preview_is_never_a_value: true  # spec §1.9.3 — needs a regression test, not a comment
  shatter: complaint -> freeze-to-draft-and-log
  exclusive_ownership: true              # 409 never retried
  no_ghost_watchers: true                # a promise to follow up requires a persisted wake row
  approval_binds_to_revision: true
  grant_taxonomy: [allow_once, allow_always, deny]   # collapsing once+always is the bug
  always_grant_must_name_scope: true
  # --- the member as a subject, not only as an input source (spec §2.9, PRD FR-5) ---
  member_visible_binds_to_human: true   # FR-5.1: every member-visible utterance writes `on_behalf_of` at send time
  member_opt_out_persists_across_lanes: true   # FR-5.2: suppression is cross-lane and outside the escalation path
  suppression_precedence: member-over-organiser  # an `allow always` grant can NOT beat a member's stop
  external_reports_aggregate_only: true  # FR-5.3: no identifiable member leaves the community
  report_aggregation_floor: 10           # a floor value, not a suggestion; below it renders a bracket
  flagged_member_is_notified_after: true # FR-5.4: due process; the appeal re-enters the organiser's queue
  digest_sources_are_consent_scoped: true # FR-5.7: the quiet member is not described by the fleet
  member_message_cap_per_24h: 2          # FR-5.5 (phase 2 value, declared now so lanes inherit it)
  quiet_hours: member_local_time         # FR-5.5: the member's timezone, not the organiser's
  # --- cross-community promotion (spec §2.11, PRD FR-6) ---
  cross_promo_never_exports_member_data: true    # FR-6.1: partners receive copy, never people
  partner_claims_carry_sources: true             # FR-6.2: a partner's number without a named source escalates
  cross_promo_discloses_partner: true            # FR-6.3: the relationship is in the copy, both languages
  suppression_applies_to_partner_content: true   # FR-6.4: a stop is a stop for partner content too
  cross_promo_counts_against_member_cap: true    # FR-6.4: a partnership is not a second quota lane
  cross_promo_per_event_cap: 1                   # FR-6.5: a partner's reach is not our cadence (bounded 0-3)
  defaults: deny

# --- The community's coverage window: the hours a human is on duty for this community. ---------
#
# NOT the member's quiet hours. Quiet hours (FR-5.5) live in each member's own timezone and are a
# member protection — they answer "may I contact this person". This window answers a different
# question: "was anyone watching when this community was left waiting". Only the community can state
# its own staffing, so it is a pack fact and not a floor the org may lower.
#
# It is read as a LOCAL wall clock in `timezone`, never as a stored UTC offset — so "09:00" still means
# 09:00 on both sides of a daylight-saving change. `mode: always` is a genuinely 24/7 community.
#
# A shift that ENDS while an obligation is still open is what the health read counts; a shift that has
# not ended yet is not a miss, and a weekend gap is not a miss either. That is what keeps this a
# staffing fact rather than a blame metric.
# --- The community's operating posture: how THIS community is run. ------------------------------------
#
# There is no country table in the runtime and never will be: it does not know that one place
# tolerates being approached more than another, and a rule nobody in this community chose would be a
# stereotype in code. So this community says, and the runtime holds the fleet to it (spec §2.15).
#
# `contact: open` — this community DOES reach out to people who have not asked it anything: the
#   no-show nudge and the RSVP chase are the point of an event community, and a member who has not
#   heard from us in three weeks is one we have lost. It is still bounded by the per-24h cap, by the
#   member's own quiet hours, and by a member's "Stop." — which beats any of it.
# `openness: open` — a kopdar is a PUBLIC event community: the point is that people can find it and
#   join. `commit.channel-post` is still `draft` under the org's ceiling, so nothing posts on its own.
posture:
  contact: open
  openness: open

coverage:
  mode: staffed
  timezone: Asia/Jakarta
  # The staffed windows, as a LIST — because a community's week may be SPLIT. One window can only
  # say "these days, these hours"; the UAE's federal government works Monday–Thursday and a HALF day
  # on Friday, with Saturday and Sunday as the weekend (u.ae and the DGHR "New Weekly Work System" FAQ,
  # read 2026-10-23), and so does a church or a makerspace with a Saturday session. A single window
  # would say such a community is on duty on Friday evening and off duty on Saturday morning — both
  # exactly backwards. (D57)
  windows:
    - days: mon,tue,wed,thu,fri
      opens: "09:00"
      closes: "18:00"

budgets:
  llm_per_event_idr: null                # REAL field, UNSET value. Owner's call — PRD §12-Q9.
                                         # Do not fill this with a plausible number; see PACK.md note 3.
  warn_at_ratio: 0.8                     # warn before the stop, never silently
  hard_stop: true
  currency_denomination: event_scoped_money   # not tokens; a volunteer organiser reads rupiah
  queue_max: 20
  max_actions_per_run: 15                # exceed -> truncated: true, partial kept, no retry storm
                                         # "per run" = per handle the host hands `runActions` (D38):
                                         # a call with no handle bounds itself, so a per-agent tick is 15 x agents,
                                         # not 15. This is NOT a fleet ceiling.

# --- The anti-generic-skeleton gate -------------------------------------------
# An installer cannot boot this pack without answering these. If any is unset, the
# pack refuses rather than inventing content — which is the failure mode that makes
# AI community tools feel like spam.
needs:
  - community_name
  - schedule                             # recurring cadence, not a single date
  - venue_source                         # gcal | luma (Plus only) | manual
  - sponsor_list                         # may be empty; never fabricated
  - escalation_contact                   # LOAD-BEARING: escalate-to-human has no target without it
  - member_notice_text                   # disclosure copy for the group — required, not optional
  - rsvp_source_of_truth                 # the named export rsvp-chase reconciles against
  - partner_policy                       # named allowed partners + required disclosure line; unset = the class never fires

# --- The ladder a member climbs before they are gone (DECISIONS.md D37) ------------------
# Declared, never executed. The fleet holds no sanction tool: **PKG-63** refuses a pack whose `tools:`
# list names a rung, and `runtime/src/pack.ts` refuses it again at boot, so these lines are a promise the
# community makes to its members rather than a capability. Every rung names the human who acts and what
# the member is told; the last one names the way back in.
#
# Two things this block is NOT. It is not send-ready copy — the words are the organiser's own, in both
# languages, at the moment they act (that is `needs.member_notice_text`'s job for the fleet's copy, and
# nothing here is the fleet's). And it is not required: a community that does not moderate may delete it,
# and the runtime will not hand a community a ladder it did not write down.
sanction_ladder:
  - rung: nudge
    by: organiser
    member_told: 'a reminder of the rule in the thread, naming the rule and not the person'
    via: organiser-in-channel
  - rung: private-word
    by: organiser
    member_told: 'a direct message from the organiser: what was broken, and what would fix it'
    via: organiser-in-dm
  - rung: public-correction
    by: organiser
    member_told: 'a correction posted where the claim was made, so the thread keeps the right version'
    via: organiser-in-channel
  - rung: removal
    by: organiser
    member_told: 'that you were removed, by whom, on which rung, and how to appeal it'
    via: host-ui                                 # the platform's own control, used by a human in the platform's UI
    appeal: 'appeal in the group and the flag re-enters the organiser queue, where the human decides it — never the agent that flagged (spec §2.9.4)'

attribution:
  author: filbert (@handle)              # immutable in the pack hash
  powered: auto-counted                  # every real event run increments a public usage trail
  fork_chain: []                         # ancestors credited; status payoff, not payout
  provenance:
    donated_shape: paperclipai/paperclip teams-catalog (read at master, 2026-10-17)
    evidence: [research/PAPERCLIP-OSS-STUDY-2026-10-17.md, research/COMPETITOR-ANALYSIS-2026-10-17.md]
