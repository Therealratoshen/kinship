# pack.local.example.yaml — jawaban yang dipakai sebuah komunitas.
#
# Salin berkas ini menjadi `pack.local.yaml` di sebelahnya
# (`packs/kopdar-ops/pack.local.yaml`) lalu isi. Berkas itu di-gitignore: nama asli, kanal, dan
# kontak komunitasmu tidak pernah masuk ke repositori. Tidak ada apa pun di `runtime/` yang
# membacanya — host yang membacanya, lalu menyerahkan jawabannya ke runtime lewat memori. Lihat
# `adapters/reference/README.md` (dan `README.id.md` untuk versi bahasa Indonesia).
#
# Setiap kunci di bawah adalah satu dari `needs:` milik paket — delapan jawaban yang tidak akan
# pernah dikarang oleh fleet. Paket tidak mau boot tanpa kedelapan answer, dan host menolak jawaban
# yang tidak diminta paket, jadi salah ketik di sini adalah kegagalan yang keras, bukan diam-diam
# tidak berlaku.
#
# Nilai boleh diapit tanda kutip; tanda kutipnya dilepas. Tanda `#` memulai komentar hanya kalau
# diikuti spasi, jadi nilai boleh memuat satu.
#
# -- Terjemahan. Sumbernya `pack.local.example.yaml` (bahasa Inggris). Kunci dan nilainya tidak
#    diterjemahkan: keduanya identifier, bukan kalimat.

# Nama komunitas, seperti yang dikenal anggota. Ia muncul di baris pengungkapan kanonik yang
# dibawa setiap pesan yang menghadap anggota, dalam dua bahasa.
community_name: "AI Builders ID"

# Ritme berulang, bukan satu tanggal. Fase-fase fleet diturunkan dari ini.
schedule: "every other Saturday"

# Dari mana tempat acara diperoleh: `gcal`, `luma` (Plus saja), atau `manual`.
venue_source: "manual"

# Para sponsor, atau kata-kata `none yet`. Tidak pernah dikarang — daftar kosong adalah jawaban
# yang jujur.
sponsor_list: "none yet"

# PENTING: `escalate-to-human` tidak punya tujuan tanpa ini. Ini manusia bernama.
escalation_contact: "organiser"

# Naskah pengungkapan untuk grup, dalam dua bahasa. Wajib, bukan opsional.
member_notice_text: "bot ini asisten organiser, bukan manusia"

# Ekspor bernama yang reread oleh `rsvp-chase`. Sebutkan, atau lane itu tidak punya apa pun untuk
# dibaca.
rsvp_source_of_truth: "google form"

# Mitra yang diizinkan dan baris pengungkapan yang mereka wajibkan. KOSONG berarti kelas
# promosi lintas komunitas **tidak pernah** aktif sama sekali — ketiadaan, bukan penolakan.
partner_policy: "Kopdar Sebelah saja; wajib baris disclosure"
